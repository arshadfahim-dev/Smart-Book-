services:
  db:
    image: postgres:16-alpine
    container_name: smartbook-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: smartbook
      POSTGRES_USER: smartbook
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-smartbook_local_dev}
    ports:
      - "5432:5432"
    volumes:
      - smartbook_pgdata:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U smartbook -d smartbook"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: smartbook-app
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_URL: ${APP_URL:-http://localhost:3000}
      DATABASE_URL: postgresql://smartbook:${POSTGRES_PASSWORD:-smartbook_local_dev}@db:5432/smartbook
      SESSION_SECRET: ${SESSION_SECRET:-}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_INITIAL_PASSWORD: ${ADMIN_INITIAL_PASSWORD:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}

volumes:
  smartbook_pgdata:
